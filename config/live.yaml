# ATNN v2 — LIVE TRADING Configuration
# This config enables equities trading on IBKR account U22452226.
# Options remain DORMANT until explicitly authorized.

system:
  name: "ATNN-v2"
  mode: "live"
  log_level: "INFO"
  data_dir: "/app/data"
  model_dir: "/app/models"

broker:
  host: "127.0.0.1"
  port: 4003            # IB Gateway live (socat forwards to 4001)
  client_id: 1
  account: "U22452226"
  timeout: 30
  auto_reconnect: true
  max_reconnect_attempts: 10

universe:
  symbols:
    - SPY
    - QQQ
    - IWM
    - AAPL
    - MSFT
    - AMZN
    - NVDA
    - META
    - GOOGL
    - TSLA
    - XLF    # Financials
    - XLE    # Energy
    - XLK    # Technology
    - XLV    # Healthcare
    - XLI    # Industrials
    - GLD    # Gold (uncorrelated)
    - TLT    # Long-term bonds (uncorrelated)
  benchmark: SPY

tda:
  ph_window: 30
  corr_window: 60
  diffusion_time: 1.0
  spectral_threshold: 1.0
  regime_lookback: 252

nn:
  model_type: "lstm"
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  sequence_length: 60
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  early_stopping_patience: 10
  direction_threshold: 0.005

ensemble:
  default_tda_weight: 0.5
  default_nn_weight: 0.5
  min_signal_strength: 0.15    # Lowered from 0.3 — let more signals through, brackets manage risk
  agreement_bonus: 0.2
  disagreement_penalty: 0.3

risk:
  max_position_pct: 0.15        # 15% of NAV per position
  max_sector_pct: 0.50          # 50% sector cap
  max_long_exposure: 1.0
  max_short_exposure: 0.30      # Allow up to 30% short exposure (requires margin account)
  max_gross_exposure: 1.0       # Max 100% invested (no leverage)
  kelly_fraction: 0.5
  daily_loss_reduce_pct: 0.03
  daily_loss_flatten_pct: 0.05
  max_drawdown_halt_pct: 0.15
  max_equity_position: 1200.0
  small_account:
    enabled: true
    max_risk_per_trade: 400     # Max $400 risk per trade (~7% of $6K)
    max_concurrent_positions: 5
    max_option_premium: 200
    max_equity_position: 1000   # Max $1000 per equity position (~16% of $6K)

options:
  enabled: false          # DORMANT — do NOT enable until authorized

equities:
  enabled: true           # LIVE — authorized by board
  fractional_shares: false  # IBKR TWS API does NOT support fractional shares
  allow_shorting: false     # Set to true AFTER upgrading IBKR to margin account

backtest:
  initial_capital: 6043.0
  train_window: 756
  test_window: 21
  purge_gap: 5
  embargo_gap: 5
  commission_per_share: 0.005
  commission_per_contract: 0.65
  slippage_pct: 0.001

schedule:
  market_open: "09:30"
  market_close: "16:00"
  timezone: "America/New_York"
  signal_time: "09:45"        # First cycle starts 15 min after open
  reconciliation_time: "15:45"
  cycle_interval_minutes: 15   # Rolling signal cycle every 15 min
