# ATNN v2 — LIVE TRADING Configuration
# This config enables equities trading on IBKR account U22452226.
# Options remain DORMANT until explicitly authorized.

system:
  name: "ATNN-v2"
  mode: "live"
  log_level: "INFO"
  data_dir: "/app/data"
  model_dir: "/app/models"

broker:
  host: "127.0.0.1"
  port: 4003            # IB Gateway live (socat forwards to 4001)
  client_id: 1
  account: "U22452226"
  timeout: 30
  auto_reconnect: true
  max_reconnect_attempts: 10

universe:
  symbols:
    # --- Indices & ETFs (6) ---
    - SPY     # S&P 500
    - QQQ     # Nasdaq 100
    - IWM     # Russell 2000
    - GLD     # Gold
    - TLT     # Long-term bonds
    - XLE     # Energy sector
    # --- Mega-cap Tech (8) ---
    - AAPL
    - MSFT
    - AMZN
    - NVDA
    - META
    - GOOGL
    - TSLA
    - NFLX
    # --- Tech / Semiconductor (6) ---
    - AMD
    - CRM
    - INTC
    - AVGO
    - ADBE
    - ORCL
    # --- Finance (6) ---
    - JPM
    - BAC
    - GS
    - V
    - MA
    - XLF
    # --- Healthcare (5) ---
    - JNJ
    - UNH
    - PFE
    - ABBV
    - MRK
    # --- Consumer (7) ---
    - WMT
    - COST
    - HD
    - MCD
    - NKE
    - SBUX
    - DIS
    # --- Energy (3) ---
    - XOM
    - CVX
    - COP
    # --- Industrials (4) ---
    - CAT
    - BA
    - UPS
    - XLI
    # --- Other (5) ---
    - UBER
    - LIN     # Materials
    - NEE     # Utilities
    - O       # Real estate
    - XLV     # Healthcare sector
  benchmark: SPY

tda:
  ph_window: 30
  corr_window: 60
  diffusion_time: 1.0
  spectral_threshold: 1.0
  regime_lookback: 252

nn:
  model_type: "lstm"
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  sequence_length: 60
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  early_stopping_patience: 10
  direction_threshold: 0.005

ensemble:
  default_tda_weight: 0.5
  default_nn_weight: 0.5
  min_signal_strength: 0.15    # Lowered from 0.3 — let more signals through, brackets manage risk
  agreement_bonus: 0.2
  disagreement_penalty: 0.3

risk:
  max_position_pct: 0.12        # 12% of NAV per position (deploy more capital across more positions)
  max_sector_pct: 0.40          # 40% sector cap
  max_long_exposure: 1.0
  max_short_exposure: 0.40      # Allow up to 40% short exposure
  max_gross_exposure: 1.0       # Max 100% invested (no leverage)
  kelly_fraction: 0.5
  daily_loss_reduce_pct: 0.03
  daily_loss_flatten_pct: 0.05
  max_drawdown_halt_pct: 0.15
  max_equity_position: 900.0    # Max $900 per position (more positions, less concentration)
  small_account:
    enabled: true
    max_risk_per_trade: 600     # Max $600 risk per trade (~10% of $6K)
    max_concurrent_positions: 10 # More positions = more diversified alpha
    max_option_premium: 200
    max_equity_position: 900    # Max $900 per equity position (~15% of $6K)

options:
  enabled: false          # DORMANT — do NOT enable until authorized

equities:
  enabled: true           # LIVE — authorized by board
  fractional_shares: false  # IBKR TWS API does NOT support fractional shares
  allow_shorting: true      # Margin account confirmed — short selling enabled
  account_type: "margin"    # Keep margin for short selling capability
                            # PDT applies (3 day trades per 5 rolling days if <$25K)
                            # Bot uses swing-hold strategy to minimize PDT burn

backtest:
  initial_capital: 6043.0
  train_window: 756
  test_window: 21
  purge_gap: 5
  embargo_gap: 5
  commission_per_share: 0.005
  commission_per_contract: 0.65
  slippage_pct: 0.001

schedule:
  market_open: "09:30"
  market_close: "16:00"
  timezone: "America/New_York"
  signal_time: "09:45"        # First cycle starts 15 min after open
  reconciliation_time: "15:45"
  cycle_interval_minutes: 2    # Near-continuous scanning (~2 min between cycles)
