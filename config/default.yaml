# ATNN v2 Configuration
system:
  name: "ATNN-v2"
  mode: "paper"  # paper | live | backtest
  log_level: "INFO"
  data_dir: "./data"
  model_dir: "./models"

broker:
  host: "127.0.0.1"
  port: 7497  # 7497=TWS paper, 4002=Gateway live, 4001=Gateway paper
  client_id: 1
  account: "U22452226"
  timeout: 30
  auto_reconnect: true
  max_reconnect_attempts: 5

universe:
  # Start with liquid, options-heavy tickers for the $444 account
  symbols: ["SPY", "QQQ", "IWM", "AAPL", "MSFT", "AMZN", "NVDA", "META", "GOOGL", "TSLA"]
  benchmark: "SPY"

tda:
  ph_window: 30
  corr_window: 60
  diffusion_time: 1.0
  spectral_threshold: 1.0
  regime_lookback: 252

nn:
  model_type: "lstm"  # lstm | attention_lstm
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  sequence_length: 60
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  early_stopping_patience: 10
  direction_threshold: 0.005  # +/-0.5% for up/down/flat

ensemble:
  default_tda_weight: 0.5
  default_nn_weight: 0.5
  min_signal_strength: 0.3
  agreement_bonus: 0.2
  disagreement_penalty: 0.3

risk:
  max_position_pct: 0.05        # 5% of NAV per position
  max_sector_pct: 0.20          # 20% per sector
  max_long_exposure: 1.0        # 100% long
  max_short_exposure: 0.5       # 50% short
  max_gross_exposure: 1.3       # 130% gross
  kelly_fraction: 0.5           # half-Kelly
  daily_loss_reduce_pct: 0.03   # 3% -> reduce to 50%
  daily_loss_flatten_pct: 0.05  # 5% -> flatten all
  max_drawdown_halt_pct: 0.15   # 15% -> halt system
  # $444 account specific
  small_account:
    enabled: true
    max_risk_per_trade: 50      # $50 max risk
    max_concurrent_positions: 3
    max_option_premium: 50      # $50 max option cost

options:
  enabled: false  # DORMANT - do NOT set to true until explicitly authorized
  strategies: ["vertical_spread", "iron_condor"]
  default_dte_range: [14, 45]   # Days to expiration
  profit_target_pct: 0.50       # Close at 50% of max profit
  early_close_dte: 2            # Close if DTE <= 2
  max_delta: 0.30               # Max delta for short strikes
  preferred_underlyings: ["SPY", "QQQ"]

equities:
  enabled: false  # DORMANT - do NOT set to true until explicitly authorized

backtest:
  initial_capital: 444.0
  train_window: 756   # 3 years of trading days
  test_window: 21     # 1 month
  purge_gap: 5
  embargo_gap: 5
  commission_per_share: 0.005
  commission_per_contract: 0.65
  slippage_pct: 0.001

schedule:
  market_open: "09:30"
  market_close: "16:00"
  timezone: "America/New_York"
  # Run signal generation 15 min after open (let opening volatility settle)
  signal_time: "09:45"
  # Run EOD reconciliation 15 min before close
  reconciliation_time: "15:45"
