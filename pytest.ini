[pytest]
# Default test discovery covers the maintained ETF engine suite. The deprecated
# Alpaca/`core` equities engine tests carry pre-existing, known config-drift
# failures and are excluded from the default run via the ``legacy`` marker — run
# them explicitly with ``pytest -m legacy`` if you are working on that engine.
testpaths = tests
addopts = -m "not legacy"
markers =
    etf: ETF tactical-allocation engine tests (the production target)
    legacy: deprecated equities/core (Alpaca) engine tests — not maintained
